URL=[MeasureJSON]
StringIndex=5
[MeasureS2Value]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=6
[MeasureS2Color]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=7

[MeasureS3Label]
