; HA Status Board
; https://github.com/VagueDustin/rainmeter-homeassistant
;
; Clock, date, climate and a presence board. Time and date come from the
; machine itself; climate and presence come from Home Assistant via
; /local/statusboard.json, written by the rainmeter_statusboard package.
;
; Presence slots are data-driven: the JSON carries a `count` and up to six
; name/colour/time triples, and unused slots hide themselves. Adding or
; removing a person is a YAML edit on the HA side - this file never changes.
;
; Designed to sit at the top of the screen as a companion to HA Now Playing at
; the bottom: same panel fill, same corner radius, same shadowed text.

[Rainmeter]
Update=1000
AccurateText=1
RightMouseUpAction=[!SkinMenu]
; Self-centering at the top of the screen, same margin as the bottom skin.
OnRefreshAction=[!Move "((#SCREENAREAWIDTH#-#W#)/2)" "#Margin#"]

[Metadata]
Name=HA Status Board
Author=Dustin Szabo
Information=Clock, date, climate and a presence board fed by Home Assistant. Up to six people; empty slots hide themselves.
Version=1.0.0
License=MIT

[Variables]
; ---------------------------------------------------------------------------
; EDIT THIS: the address this PC uses to reach Home Assistant, with port.
; ---------------------------------------------------------------------------
HA=http://homeassistant.local:8123

; Degrees are formatted on the HA side and arrive inside the JSON, so this
; file stays pure ASCII. Rainmeter reads a BOM-less .ini as ANSI and would
; render a UTF-8 degree sign as mojibake.
;
; 12-hour clock by default. For 24-hour, use %H:%M and clear ClockSuffix.
ClockFormat=%#I:%M %p
DateFormat=%B %#d, %Y

W=680
H=236
Margin=24
Radius=12
Font=Roboto
PanelColor=32,32,32,110
TextColor=255,255,255
MutedColor=170,178,190
Shadow=0,0,0,220
; Horizontal padding before the first and after the last presence column.
PadX=48

;=MEASURES======================================================================

[MeasureTime]
Measure=Time
Format=#ClockFormat#

[MeasureDay]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=#DateFormat#

[MeasureJSON]
Measure=WebParser
URL=#HA#/local/statusboard.json
RegExp=(?siU)"cur":\s*"(.*)".*"set":\s*"(.*)".*"action":\s*"(.*)".*"acolor":\s*"(.*)".*"climate_on":\s*"(.*)".*"count":\s*"(.*)".*"p1_name":\s*"(.*)".*"p1_color":\s*"(.*)".*"p1_time":\s*"(.*)".*"p2_name":\s*"(.*)".*"p2_color":\s*"(.*)".*"p2_time":\s*"(.*)".*"p3_name":\s*"(.*)".*"p3_color":\s*"(.*)".*"p3_time":\s*"(.*)".*"p4_name":\s*"(.*)".*"p4_color":\s*"(.*)".*"p4_time":\s*"(.*)".*"p5_name":\s*"(.*)".*"p5_color":\s*"(.*)".*"p5_time":\s*"(.*)".*"p6_name":\s*"(.*)".*"p6_color":\s*"(.*)".*"p6_time":\s*"(.*)"
UpdateRate=15

[MeasureCur]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=1

[MeasureSet]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=2

[MeasureAction]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=3

[MeasureAColor]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=4

; 1 when a climate entity is configured and reporting; hides the whole
; temperature block otherwise so a setup without one is not left with "--".
[MeasureClimateOn]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=5
IfMatch=^1$
IfMatchAction=[!ShowMeterGroup Climate][!Redraw]
IfNotMatchAction=[!HideMeterGroup Climate][!Redraw]

[MeasureCount]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=6

; Presence slots. Six sets of name / colour / time, string indices 7..24.
[MeasureP1Name]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=7
[MeasureP1Color]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=8
[MeasureP1Time]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=9

[MeasureP2Name]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=10
[MeasureP2Color]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=11
[MeasureP2Time]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=12

[MeasureP3Name]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=13
[MeasureP3Color]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=14
[MeasureP3Time]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=15

[MeasureP4Name]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=16
[MeasureP4Color]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=17
[MeasureP4Time]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=18

[MeasureP5Name]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=19
[MeasureP5Color]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=20
[MeasureP5Time]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=21

[MeasureP6Name]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=22
[MeasureP6Color]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=23
[MeasureP6Time]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=24

;=METERS========================================================================

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,#W#,#H#,#Radius# | Fill Color #PanelColor# | StrokeWidth 0

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=(#W#/2)
Y=18
FontFace=#Font#
FontSize=52
FontWeight=350
FontColor=#TextColor#
StringEffect=Shadow
FontEffectColor=#Shadow#
StringAlign=CenterTop
AntiAlias=1
Text=%1

[MeterDayDate]
Meter=String
MeasureName=MeasureDay
MeasureName2=MeasureDate
X=(#W#/2)
Y=94
FontFace=#Font#
FontSize=15
FontWeight=350
FontColor=#MutedColor#
StringEffect=Shadow
FontEffectColor=#Shadow#
StringAlign=CenterTop
AntiAlias=1
Text=%1, %2

[MeterDivider]
Meter=Shape
Shape=Line 40,126,(#W#-40),126 | StrokeWidth 1 | Stroke Color 255,255,255,28

; --- climate -----------------------------------------------------------------
; Current temperature on the left, setpoint on the right, hvac action tinted
; between them.

[MeterTempCur]
Meter=String
Group=Climate
MeasureName=MeasureCur
X=40
Y=138
FontFace=#Font#
FontSize=26
FontWeight=350
FontColor=#TextColor#
StringEffect=Shadow
FontEffectColor=#Shadow#
StringAlign=LeftTop
AntiAlias=1
Text=%1

[MeterAction]
Meter=String
Group=Climate
MeasureName=MeasureAction
X=(#W#/2)
Y=145
FontFace=#Font#
FontSize=14
FontWeight=400
FontColor=[MeasureAColor]
StringEffect=Shadow
FontEffectColor=#Shadow#
StringAlign=CenterTop
AntiAlias=1
DynamicVariables=1
Text=%1

[MeterTempSet]
Meter=String
Group=Climate
MeasureName=MeasureSet
X=(#W#-40)
Y=145
FontFace=#Font#
FontSize=14
FontWeight=400
FontColor=#MutedColor#
StringEffect=Shadow
FontEffectColor=#Shadow#
StringAlign=RightTop
AntiAlias=1
Text=SET %1

; --- presence ----------------------------------------------------------------
; Column centres are computed from the live count, so three people spread
; across the panel exactly like six do. Slots past the count hide themselves.
;
; Rainmeter has no loops, hence six near-identical pairs. The only differences
; are the measure names and the slot index in the X and Hidden formulas.

[MeterNameP1]
Meter=String
MeasureName=MeasureP1Name
X=(#PadX#+(#W#-2*#PadX#)*(1-0.5)/Max([MeasureCount],1))
Y=188
FontFace=#Font#
FontSize=17
FontWeight=500
FontColor=[MeasureP1Color]
StringEffect=Shadow
FontEffectColor=#Shadow#
StringAlign=CenterTop
AntiAlias=1
DynamicVariables=1
Hidden=(1>[MeasureCount])
Text=%1

[MeterTimeP1]
Meter=String
MeasureName=MeasureP1Time
X=(#PadX#+(#W#-2*#PadX#)*(1-0.5)/Max([MeasureCount],1))
Y=210
FontFace=#Font#
FontSize=12
FontWeight=350
FontColor=#MutedColor#
StringEffect=Shadow
FontEffectColor=#Shadow#
StringAlign=CenterTop
AntiAlias=1
DynamicVariables=1
Hidden=(1>[MeasureCount])
Text=%1

