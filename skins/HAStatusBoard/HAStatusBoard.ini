; HA Status Board
; https://github.com/VagueDustin/rainmeter-homeassistant
;
; A clock with two configurable rows of Home Assistant data underneath.
;
;   STATS   up to 4 slots, each a label over a value. Temperature, power draw,
;           air quality, disk free, next bin day - anything you can render to
;           a string in a template.
;   CHIPS   up to 6 slots, each a coloured name over a smaller sub-line.
;           People and arrival times, doors and open/closed, printers and
;           ready/error, servers and up/down.
;
; Nothing here is specific to any entity. Both rows are driven entirely by
; /local/statusboard.json, so what appears is decided in YAML on the Home
; Assistant side and this file never changes. Empty slots hide themselves,
; whole rows collapse when their count is zero, and the panel height follows.
;
; Time and date come from the machine, not from HA, so the clock keeps
; ticking if Home Assistant goes away.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
RightMouseUpAction=[!SkinMenu]
; Self-centering at the top of the screen, same margin as the bottom skin.
OnRefreshAction=[!Move "((#SCREENAREAWIDTH#-#W#)/2)" "#Margin#"]

[Metadata]
Name=HA Status Board
Author=Dustin Szabo
Information=A clock plus two configurable rows of Home Assistant data: up to 4 stat slots and 6 chip slots, all defined in YAML rather than in the skin.
Version=1.1.0
License=MIT

[Variables]
; ---------------------------------------------------------------------------
; EDIT THIS: the address this PC uses to reach Home Assistant, with port.
; ---------------------------------------------------------------------------
HA=http://homeassistant.local:8123

; Units and symbols are formatted on the HA side and arrive inside the JSON,
; so this file stays pure ASCII. Rainmeter reads a BOM-less .ini as ANSI and
; would render a UTF-8 degree sign as mojibake.
ClockFormat=%#I:%M %p
DateFormat=%B %#d, %Y

W=680
Margin=24
Radius=12
Font=Roboto
PanelColor=32,32,32,110
TextColor=255,255,255
MutedColor=170,178,190
Shadow=0,0,0,220
; Horizontal padding before the first and after the last column in a row.
PadX=48

; Row geometry. ClockH is where the clock block ends; the two rows stack after
; it and the panel height is the sum of whatever is actually shown.
ClockH=126
StatsH=62
ChipsH=48

;=MEASURES======================================================================

[MeasureTime]
Measure=Time
Format=#ClockFormat#

[MeasureDay]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=#DateFormat#

[MeasureJSON]
Measure=WebParser
URL=#HA#/local/statusboard.json
RegExp=(?siU)"stat_count":\s*"(.*)".*"s1_label":\s*"(.*)".*"s1_value":\s*"(.*)".*"s1_color":\s*"(.*)".*"s2_label":\s*"(.*)".*"s2_value":\s*"(.*)".*"s2_color":\s*"(.*)".*"s3_label":\s*"(.*)".*"s3_value":\s*"(.*)".*"s3_color":\s*"(.*)".*"s4_label":\s*"(.*)".*"s4_value":\s*"(.*)".*"s4_color":\s*"(.*)".*"chip_count":\s*"(.*)".*"c1_name":\s*"(.*)".*"c1_color":\s*"(.*)".*"c1_sub":\s*"(.*)".*"c2_name":\s*"(.*)".*"c2_color":\s*"(.*)".*"c2_sub":\s*"(.*)".*"c3_name":\s*"(.*)".*"c3_color":\s*"(.*)".*"c3_sub":\s*"(.*)".*"c4_name":\s*"(.*)".*"c4_color":\s*"(.*)".*"c4_sub":\s*"(.*)".*"c5_name":\s*"(.*)".*"c5_color":\s*"(.*)".*"c5_sub":\s*"(.*)".*"c6_name":\s*"(.*)".*"c6_color":\s*"(.*)".*"c6_sub":\s*"(.*)"
UpdateRate=15
; If HA goes away the clock should keep working rather than the skin going
; blank, so a failure only collapses the data rows.
OnConnectErrorAction=[!HideMeterGroup Stats][!HideMeterGroup Chips][!Redraw]

[MeasureStatCount]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=1

[MeasureS1Label]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=2
[MeasureS1Value]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=3
[MeasureS1Color]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=4

[MeasureS2Label]
