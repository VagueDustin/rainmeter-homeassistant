;=METERS========================================================================

; Panel height is the clock block plus whichever rows actually have content,
; so a clock-only board is not left with a slab of empty panel underneath.
[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,#W#,(#ClockH#+([MeasureStatCount]>0?#StatsH#:0)+([MeasureChipCount]>0?#ChipsH#:0)),#Radius# | Fill Color #PanelColor# | StrokeWidth 0
DynamicVariables=1

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=(#W#/2)
Y=18
FontFace=#Font#
FontSize=52
FontWeight=350
FontColor=#TextColor#
StringEffect=Shadow
FontEffectColor=#Shadow#
StringAlign=CenterTop
AntiAlias=1
Text=%1

[MeterDayDate]
Meter=String
MeasureName=MeasureDay
MeasureName2=MeasureDate
X=(#W#/2)
Y=94
FontFace=#Font#
FontSize=15
FontWeight=350
FontColor=#MutedColor#
StringEffect=Shadow
FontEffectColor=#Shadow#
StringAlign=CenterTop
AntiAlias=1
Text=%1, %2

; Only worth a rule if there is something below it to separate.
[MeterDivider]
Meter=Shape
Shape=Line 40,(#ClockH#),(#W#-40),(#ClockH#) | StrokeWidth 1 | Stroke Color 255,255,255,28
DynamicVariables=1
Hidden=(([MeasureStatCount]+[MeasureChipCount])=0)

; --- stats row ---------------------------------------------------------------
; Column centres are computed from the live count, so two stats spread across
; the panel exactly like four do. Each slot is also given its column width
; with ClipString, so a long label ellipsizes rather than walking over its
; neighbour - names are arbitrary text from YAML, so this matters. Rainmeter has no loops, hence four
; near-identical pairs; only the measure names and the slot index differ.

[MeterS1Label]
Meter=String
Group=Stats
MeasureName=MeasureS1Label
X=(#PadX#+(#W#-2*#PadX#)*(1-0.5)/Max([MeasureStatCount],1))
Y=(#ClockH#+8)
FontFace=#Font#
FontSize=10
FontWeight=600
FontColor=#MutedColor#
StringEffect=Shadow
FontEffectColor=#Shadow#
W=((#W#-2*#PadX#)/Max([MeasureStatCount],1)-8)
ClipString=1
StringAlign=CenterTop
AntiAlias=1
DynamicVariables=1
Hidden=(1>[MeasureStatCount])
Text=%1

[MeterS1Value]
Meter=String
Group=Stats
MeasureName=MeasureS1Value
X=(#PadX#+(#W#-2*#PadX#)*(1-0.5)/Max([MeasureStatCount],1))
Y=(#ClockH#+22)
FontFace=#Font#
FontSize=24
FontWeight=350
FontColor=[MeasureS1Color]
StringEffect=Shadow
FontEffectColor=#Shadow#
W=((#W#-2*#PadX#)/Max([MeasureStatCount],1)-8)
ClipString=1
StringAlign=CenterTop
AntiAlias=1
DynamicVariables=1
Hidden=(1>[MeasureStatCount])
Text=%1

