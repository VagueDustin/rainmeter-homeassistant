; HA Now Playing
; https://github.com/VagueDustin/rainmeter-homeassistant
;
; Album art, title and an accent-coloured artist line for whatever is playing
; in Home Assistant - any media_player, so Music Assistant, Spotify, Sonos,
; Cast, Plex and friends all work through the same skin.
;
; Why it reads a file instead of the HA API: querying HA directly needs a
; long-lived access token, and a Rainmeter skin is a plain text file sitting
; in the user's Documents folder. Instead, HA publishes two files into its
; own www folder, which it serves at /local/ without authentication:
;
;   /local/nowplaying.json        title, artist, album, source, state, rgb_rm
;   /local/nowplaying_cover.png   artwork, cache-busted via ?v= in cover_url
;
; Nothing secret is stored here and nothing secret is exposed - the files
; contain only what is already on screen.
;
; The artist line is tinted with the accent colour picked from the album art
; by nowplaying.py. See the repo README for setup.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
RightMouseUpAction=[!SkinMenu]
; Self-positioning: equal margin from the left and bottom screen edges at any
; resolution, which beats hardcoding coordinates. The panel grows RIGHTWARD to
; fit long titles (see MeterBG), so the anchor never moves.
OnRefreshAction=[!Move "#Margin#" "(#SCREENAREAHEIGHT#-#H#-#Margin#)"]

[Metadata]
Name=HA Now Playing
Author=Dustin Szabo
Information=Now playing from any Home Assistant media_player. Album art, title, and an artist line tinted with the album's accent colour.
Version=1.0.0
License=MIT

[Variables]
; ---------------------------------------------------------------------------
; EDIT THIS: the address this PC uses to reach Home Assistant, with port.
; ---------------------------------------------------------------------------
HA=http://homeassistant.local:8123

; Show which player the audio is coming from, under the artist.
; 0 hides it; if you set this to 1, raise H to about 176 to make room.
HideSource=1

; W is the MINIMUM panel width; the background stretches to fit the longer of
; the two text lines, capped at MaxW so an absurd title cannot cross the whole
; screen.
W=480
MaxW=1400
H=156
ArtSize=156
TextX=176
PadR=20
Margin=24
Radius=12
Font=Roboto
PanelColor=32,32,32,110
TitleColor=255,255,255
SourceColor=190,196,205
ShadowColor=0,0,0,220

;=MEASURES======================================================================

[MeasureJSON]
Measure=WebParser
URL=#HA#/local/nowplaying.json
RegExp=(?siU)"title":\s*"(.*)",\s*"artist":\s*"(.*)",\s*"album":\s*"(.*)",\s*"source":\s*"(.*)",\s*"state":\s*"(.*)".*"rgb_rm":\s*"(.*)".*"cover_url":\s*"(.*)"
UpdateRate=2
; A missing or unreachable file must not leave the last track frozen on screen
; forever, so treat a failed download as "nothing playing".
OnConnectErrorAction=[!HideMeterGroup NowPlaying][!Redraw]
OnRegExpErrorAction=[!HideMeterGroup NowPlaying][!Redraw]

[MeasureTitle]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=1

[MeasureArtist]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=2

[MeasureAlbum]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=3

[MeasureSource]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=4

[MeasureState]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=5
IfMatch=playing|paused
; !ShowMeterGroup un-hides EVERY meter in the group, overriding a static
; Hidden= on the source line, so the user's choice has to be re-asserted
; immediately afterwards or the optional line is always visible.
IfMatchAction=[!ShowMeterGroup NowPlaying][!SetOption MeterSource Hidden "#HideSource#"][!Redraw]
IfNotMatchAction=[!HideMeterGroup NowPlaying][!Redraw]

[MeasureRGB]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=6

; Artwork: a child measure that downloads the URL captured from the JSON. The
; ?v= on that URL is a hash of the image bytes, so a new file is fetched
; exactly when the art really changed - important because many players serve
; every cover from one unchanging URL.
[MeasureCover]
Measure=WebParser
URL=[MeasureJSON]
StringIndex=7
Download=1
DownloadFile=nowplaying_cover_dl.png
FinishAction=[!UpdateMeter MeterCover][!Redraw]

;=METERS========================================================================

; Extent probes. [Meter:W] on a meter with an explicit W reports the CONFIGURED
; width, not the rendered text - so the visible, width-capped meters below
; cannot be measured. These copies render off-screen with no W set (a negative
; X never enlarges the window), purely so their :W is the true text width.
; Deliberately NOT in the NowPlaying group: hidden meters report W=0, which
; would collapse the panel to minimum width every time it re-shows.
[MeterTitleExtent]
Meter=String
MeasureName=MeasureTitle
X=-9999
Y=0
FontFace=#Font#
FontSize=22
FontWeight=350
AntiAlias=1
Padding=0,0,0,0
Text=%1

[MeterArtistExtent]
Meter=String
MeasureName=MeasureArtist
X=-9999
Y=0
FontFace=#Font#
FontSize=25
FontWeight=350
AntiAlias=1
Padding=0,0,0,0
Text=%1

; Panel width follows the wider of the two lines via the probes above. Their
; :W values carry the PREVIOUS update's width, so the panel snaps to a new
; track's size one update after the text does - invisible at this poll rate.
[MeterBG]
Meter=Shape
Group=NowPlaying
Shape=Rectangle 0,0,(Clamp(Max([MeterTitleExtent:W],[MeterArtistExtent:W])+#TextX#+#PadR#,#W#,#MaxW#)),#H#,#Radius# | Fill Color #PanelColor# | StrokeWidth 0
DynamicVariables=1

; Rounded clip for the artwork: the image is drawn inside this shape. The fill
; must be OPAQUE - contained content inherits the container's alpha, so a
; near-transparent fill renders the art invisible.
[MeterArtClip]
Meter=Shape
Group=NowPlaying
Shape=Rectangle 0,0,#ArtSize#,#ArtSize#,#Radius# | Fill Color 255,255,255,255 | StrokeWidth 0

[MeterCover]
Meter=Image
Group=NowPlaying
Container=MeterArtClip
ImageName=[MeasureCover]
X=0
Y=0
W=#ArtSize#
H=#ArtSize#
PreserveAspectRatio=2
DynamicVariables=1

; ClipString=2 with H sized to exactly one line: the string grows freely up to
; W, then ellipsizes rather than wrapping, because no second line fits in H.
[MeterTitle]
Meter=String
Group=NowPlaying
MeasureName=MeasureTitle
X=#TextX#
Y=35
W=(#MaxW#-#TextX#-#PadR#)
H=34
FontFace=#Font#
FontSize=22
FontWeight=350
FontColor=#TitleColor#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
StringAlign=Left
ClipString=2
AntiAlias=1
Text=%1

[MeterArtist]
Meter=String
Group=NowPlaying
MeasureName=MeasureArtist
X=#TextX#
Y=85
W=(#MaxW#-#TextX#-#PadR#)
H=38
FontFace=#Font#
FontSize=25
FontWeight=350
FontColor=[MeasureRGB]
StringEffect=Shadow
FontEffectColor=#ShadowColor#
DynamicVariables=1
StringAlign=Left
ClipString=2
AntiAlias=1
Text=%1

; Optional "playing on <speaker>" line. Set HideSource=0 above to show it.
[MeterSource]
Meter=String
Group=NowPlaying
MeasureName=MeasureSource
X=#TextX#
Y=124
W=(#MaxW#-#TextX#-#PadR#)
H=22
FontFace=#Font#
FontSize=11
FontWeight=400
FontColor=#SourceColor#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
StringAlign=Left
ClipString=2
AntiAlias=1
Hidden=#HideSource#
Text=%1
